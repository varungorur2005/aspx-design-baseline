<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASPX - AI Business Solutions &amp; Security Insights</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css?v=24">
</head>
<body>
  <header class="pc-header">
    <div class="brand">
      <span class="ms-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span>Microsoft</span><span class="header-divider"></span><strong>Partner Center</strong>
    </div>
    <div class="header-actions">
      <button aria-label="Search">⌕</button><button aria-label="Settings">⚙</button>
      <button aria-label="Help">?</button><button aria-label="Notifications">♢</button>
      <span class="avatar">VG</span>
    </div>
  </header>

  <div class="shell">
    <aside class="rail">
      <div class="rail-heading">AI Business Solutions &amp; Security</div>
      <nav>
        <button class="rail-link active" data-page="growth"><span class="rail-icon">⌁</span>Growth opportunities</button>
        <button class="rail-link" data-page="mci"><span class="rail-icon">▥</span>MCI performance</button>
        <button class="rail-link" data-page="referrals"><span class="rail-icon">⇄</span>Referrals and deal clinics</button>
      </nav>
    </aside>

    <main>
      <div class="breadcrumb">Home <span>›</span> AI Business Solutions &amp; Security</div>
      <section class="title-block">
        <div>
          <h1 id="pageTitle">Growth opportunities</h1>
          <p id="pageSubtitle">AI Business Solutions &amp; Security</p>
        </div>
        <button class="insights-button" id="insightsButton"><span>ⓘ</span> Insights</button>
      </section>

      <section class="page active" id="growthPage">
        <div class="tabs" role="tablist" aria-label="Growth opportunity categories">
          <button class="tab active" data-growth="copilot">Copilot</button>
          <button class="tab" data-growth="e3">E3</button>
          <button class="tab" data-growth="e5">E5</button>
          <button class="tab" data-growth="e5exp">E5 Expansion</button>
          <button class="tab" data-growth="cloud">Cloud Endpoints</button>
          <button class="tab" data-growth="tenants">Tenants</button>
        </div>
        <div id="growthContent"></div>
      </section>

      <section class="page" id="mciPage">
        <div class="tabs" role="tablist" aria-label="MCI solution areas">
          <button class="tab active" data-mci="copilot">Copilot</button>
          <button class="tab" data-mci="security">Security</button>
          <button class="tab" data-mci="ai">AI-Ready Productivity</button>
          <button class="tab" data-mci="biz">Biz Processes</button>
        </div>
        <div id="mciContent"></div>
      </section>

      <section class="page" id="referralsPage">
        <div class="tabs" role="tablist" aria-label="Referral experiences">
          <button class="tab active" data-referral="fasttrack">FastTrack Referrals</button>
          <button class="tab" data-referral="clinic">Security Deal Clinic</button>
        </div>
        <div id="referralContent"></div>
      </section>
    </main>
  </div>

  <div class="scrim hidden" id="scrim"></div>
  <aside class="panel hidden" id="panel" aria-label="Panel">
    <header><h2 id="panelTitle">Panel</h2><button id="panelClose" aria-label="Close">×</button></header>
    <div id="panelBody"></div>
    <footer><button class="primary" id="panelApply">Apply</button><button id="panelCancel">Cancel</button></footer>
  </aside>

  <script src="js/app.js?v=20"></script>
</body>
</html>
